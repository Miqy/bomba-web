<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFF5EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Bomba – imprezowa gra słowna. Podaj dalej, zanim wybuchnie!">
    <title>Bomba</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon-192.png">
    <style>
      :root { --bg: #FFF5EB; --ink: #2B1418; --soft: #8A6A6E; --red: #E63946; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
      body { display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 35%, #FFE4D2 0%, var(--bg) 60%); }
      /* Telefon: pełny ekran. Komputer: pionowa "ramka" telefonu na środku. */
      #frame { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
      @media (min-aspect-ratio: 3/4) {
        #frame { height: min(100vh, 960px); width: calc(min(100vh, 960px) * 0.5);
          border-radius: 28px; overflow: hidden; box-shadow: 0 24px 70px rgba(120, 30, 30, .25); }
      }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); outline: none; }
      #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 22px; background: var(--bg); transition: opacity .4s ease; }
      #loader img { width: 112px; height: 112px; border-radius: 26px; animation: bob 1.6s ease-in-out infinite;
        box-shadow: 0 12px 30px rgba(230, 57, 70, .3); }
      #loader h1 { margin: 0; font-size: 34px; letter-spacing: 2px; color: var(--ink); }
      #loader h1 b { color: var(--red); }
      #bar { width: 60%; max-width: 260px; height: 10px; border-radius: 99px; background: #F3DDD6; overflow: hidden; }
      #fill { height: 100%; width: 0%; border-radius: 99px; background: var(--red); transition: width .2s ease; }
      #hint { font-size: 14px; color: var(--soft); }
      @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader">
        <img src="TemplateData/icon-192.png" alt="">
        <h1>B<b>O</b>MBA</h1>
        <div id="bar"><div id="fill"></div></div>
        <div id="hint">Ładowanie lontu…</div>
      </div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill");
      var loader = document.querySelector("#loader");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Miqydev",
        productName: "Bomba",
        productVersion: "0.1.0",
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loader.style.opacity = "0";
        setTimeout(function () { loader.style.display = "none"; }, 450);
      }).catch(function (message) {
        document.querySelector("#hint").textContent = "Nie udało się uruchomić gry: " + message;
      });
    </script>
  </body>
</html>
